# Tiny Tapeout project information
project:
  title:        "Synthétiseur additif"      # Project title
  author:       "LEAD"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Synthétiseur audio additif"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     49152000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "3x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_laboratoirelead_synth"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "i2s_tx.v"
    - "generateur_test.v"
    - "sonde_b.v"
    - "sonde_tables.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SPI_CS (mises à jour, RP2350 GPIO17)"
  ui[1]: "SPI_SCK (RP2350 GPIO18)"
  ui[2]: "SPI_MOSI (RP2350 GPIO19)"
  ui[3]: "TEST_TONE (1 = son de test)"
  ui[4]: "SONDE (1 = synthèse piste B d'essai)"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "I2S_MCLK (Pmod I2S2)"
  uo[1]: "I2S_LRCLK (Pmod I2S2)"
  uo[2]: "I2S_BCLK (Pmod I2S2 SCLK)"
  uo[3]: "I2S_SD (Pmod I2S2 SDIN)"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "CS flash (maintenu haut)"
  uio[1]: "QSPI SD0 / MOSI"
  uio[2]: "QSPI SD1 / MISO"
  uio[3]: "QSPI SCK"
  uio[4]: "QSPI SD2"
  uio[5]: "QSPI SD3"
  uio[6]: "CS PSRAM A"
  uio[7]: "CS PSRAM B"

# Do not change!
yaml_version: 6
